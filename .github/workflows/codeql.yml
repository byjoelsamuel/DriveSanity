name: CodeQL

# GitHub's code scanning: looks for real vulnerability patterns (injection, unsafe file or intent handling,
# hard-coded secrets) in the Kotlin code. Results show under the repo's Security tab.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality

      # CodeQL watches this build to see the code. No tests, no signing.
      - run: ./gradlew --no-daemon assembleDebug

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

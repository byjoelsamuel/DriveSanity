name: Quality

# Kotlin style and static analysis (tools/lint.sh), and Android's own lint. These don't build or release anything;
# the Android workflow does that. A failing check here is a reason to look before merging.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style-and-static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The linters are downloaded once and checked against checksums pinned in tools/lint.sh.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/drivesanity-lint
          key: lint-tools-${{ hashFiles('tools/lint.sh') }}

      - run: tools/lint.sh

  android-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew --no-daemon lintDebug

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.html
